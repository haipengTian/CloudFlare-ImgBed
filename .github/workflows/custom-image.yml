name: Personal Docker image

on:
  push:
    tags: ['v*-custom.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Personal version, for example v2.7.7-custom.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'haipengTian/CloudFlare-ImgBed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate version and source
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          [[ $RELEASE_TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-custom\.[0-9]+$ ]]
          base=${BASH_REMATCH[1]}
          test "$base" = "$(node -p "require('./package.json').version")"
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Upstream maintenance tests and shell lint
        run: |
          bash -n tools/custom/sync-upstream.sh
          shellcheck -P SCRIPTDIR tools/custom/sync-upstream.sh tools/custom/tests/sync-upstream.sh
          bash tools/custom/tests/sync-upstream.sh
          node --check tools/custom/tests/smoke.mjs
          node --check deploy/server/readiness.js
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: imgbed-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker upload, authentication and restart smoke test
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d)
          cleanup() {
            result=$?
            if [[ $result != 0 ]]; then
              docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} ports={{json .NetworkSettings.Ports}}' imgbed-smoke >&2 || true
              docker logs --tail 80 imgbed-smoke >&2 || true
            fi
            docker rm -f imgbed-smoke >/dev/null 2>&1 || true
            rm -rf -- "$scratch"
            return "$result"
          }
          trap cleanup EXIT
          export BASIC_USER=smoke_admin
          export BASIC_PASS AUTH_CODE AI_CONFIG_SECRET
          BASIC_PASS=$(openssl rand -hex 32)
          AUTH_CODE=$(openssl rand -hex 32)
          AI_CONFIG_SECRET=$(openssl rand -hex 32)
          for secret in "$BASIC_PASS" "$AUTH_CODE" "$AI_CONFIG_SECRET"; do
            echo "::add-mask::$secret"
          done
          printf 'BASIC_USER=%s\nBASIC_PASS=%s\nAUTH_CODE=%s\nAI_CONFIG_SECRET=%s\n' "$BASIC_USER" "$BASIC_PASS" "$AUTH_CODE" "$AI_CONFIG_SECRET" > "$scratch/env"
          docker run -d --name imgbed-smoke --env-file "$scratch/env" --publish 127.0.0.1::8080 imgbed-smoke:local >/dev/null
          port=$(docker port imgbed-smoke 8080/tcp | cut -d: -f2)
          ready() {
            for _ in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then return 0; fi
              sleep 1
            done
            return 1
          }
          ready
          # 在已安装实际 server/common 依赖的镜像中执行，host 不依赖 node_modules。
          docker exec imgbed-smoke mkdir -p /app/tools/custom/tests
          docker cp tools/custom/tests/readiness.mjs imgbed-smoke:/app/tools/custom/tests/readiness.mjs
          docker exec imgbed-smoke node --import ./deploy/server/register.mjs --test tools/custom/tests/readiness.mjs
          docker exec imgbed-smoke node --import ./deploy/server/register.mjs deploy/server/readiness.js
          node tools/custom/tests/smoke.mjs "http://127.0.0.1:$port" "$scratch/file.json"
          echo "Before restart: host port $port"
          docker restart imgbed-smoke >/dev/null
          port=$(docker port imgbed-smoke 8080/tcp | cut -d: -f2)
          echo "After restart: host port $port"
          ready
          node tools/custom/tests/smoke.mjs "http://127.0.0.1:$port" "$scratch/file.json" verify
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned multi-platform image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/haipengtian/cloudflare-imgbed:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/haipengTian/CloudFlare-ImgBed
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
      - name: Delivery summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            echo "Published ghcr.io/haipengtian/cloudflare-imgbed:$VERSION (amd64 smoke passed; arm64 built)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build and smoke checks passed. Manual runs do not publish images.' >> "$GITHUB_STEP_SUMMARY"
          fi
